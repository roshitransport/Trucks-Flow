name: refresh-ihmcl-data
on:
  schedule: [{cron: "0 3 * * 1"}]   # weekly; reports appear monthly
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y poppler-utils
      - run: python fetch_ihmcl.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add data && (git diff --cached --quiet || git commit -m "data refresh" && git push)
